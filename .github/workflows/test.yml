name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bats:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core

      - name: Run bats
        run: bats tests/

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint gh-octerse
        run: shellcheck -x -e SC1091 --severity=warning gh-octerse
      - name: Lint installer
        run: shellcheck --severity=warning install.sh || true   # advisory until installer is hardened

  shrink:
    name: octerse-shrink (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: mcp-servers/octerse-shrink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test built CLI
        run: |
          chmod +x dist/cli.js
          node dist/cli.js --version
          node dist/cli.js --help | head -5
