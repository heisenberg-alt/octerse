name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write   # for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release artifacts
        run: |
          mkdir -p out
          cp install.sh   out/
          cp install.ps1  out/
          (cd out && sha256sum install.sh install.ps1 > SHA256SUMS)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            out/install.sh
            out/install.ps1
            out/SHA256SUMS

  npm-publish:
    name: publish octerse-shrink to npm
    runs-on: ubuntu-latest
    # Only run when the tag's package version matches mcp-servers/octerse-shrink/package.json.
    # We compute the comparison inline; the job is a no-op if they don't match.
    needs: release
    defaults:
      run:
        working-directory: mcp-servers/octerse-shrink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Determine if this tag matches octerse-shrink package version
        id: ver
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          if [ "$tag" = "$pkg" ]; then
            echo "match=true"  >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tag ($tag) != octerse-shrink package version ($pkg). Skipping npm publish."
          fi
      - name: Install
        if: steps.ver.outputs.match == 'true'
        run: npm ci || npm install
      - name: Test
        if: steps.ver.outputs.match == 'true'
        run: npm test
      - name: Build
        if: steps.ver.outputs.match == 'true'
        run: npm run build
      - name: Publish (with provenance)
        if: steps.ver.outputs.match == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
